# Generated by scripts/gen-packaging.mjs for v0.23.2.
app-id: io.mikeweaver.freally
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: freally-ui
separate-locales: false

finish-args:
  # A filesystem search engine that cannot read the filesystem is not one.
  # This is the permission that decides whether the app works at all, and
  # the one Flathub reviewers will ask about: the index is built by walking
  # the user's own files.
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/mnt
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # The updater and the docs site; nothing else.
  - --share=network
  - --talk-name=org.freedesktop.Notifications
  # Trash integration for delete-undo (SRC-M16) goes through the portal.
  - --talk-name=org.freedesktop.FileManager1

modules:
  - name: freally-sourcerer
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm755 freally-ui.sh /app/bin/freally-ui
      - install -Dm644 io.mikeweaver.freally.metainfo.xml /app/share/metainfo/io.mikeweaver.freally.metainfo.xml
      - install -Dm644 io.mikeweaver.freally.desktop /app/share/applications/io.mikeweaver.freally.desktop
    sources:
      - type: extra-data
        filename: freally.deb
        url: https://github.com/MikesRuthless12/freally-sourcerer/releases/download/v0.23.2/Freally.Sourcerer_0.23.2_amd64.deb
        sha256: 50bc12278490a36b540dbf0baa4ff07673386017436d8f85e7cfe5ea3e4f7f9b
        size: 18979900
      - type: script
        dest-filename: apply_extra
        commands:
          - ar x freally.deb
          - tar xf data.tar.gz
          - rm -f freally.deb debian-binary control.tar.* data.tar.*
      - type: script
        dest-filename: freally-ui.sh
        commands:
          - exec /app/extra/usr/bin/freally-ui "$@"
      - type: file
        path: io.mikeweaver.freally.metainfo.xml
      - type: file
        path: io.mikeweaver.freally.desktop
