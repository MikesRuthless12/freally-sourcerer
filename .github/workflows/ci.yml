name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref. Pushing twice in a minute used to leave the first
# push's three runners grinding to completion on code nobody will look
# at; now the superseded run is cancelled as the new one starts.
# `main` is exempt: those runs populate the shared build cache every
# branch restores from, so cancelling one costs every later job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Every CI run starts from a restored cache and compiles once, so
  # incremental state is written, cached, and never read back. Off, it
  # builds faster and the saved cache is substantially smaller — which
  # is itself download time on every later job.
  CARGO_INCREMENTAL: 0
  # A flaky crates.io fetch should retry, not fail a three-OS matrix.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The whole matrix finishes well inside this; it is here so a hung
    # step fails in an hour instead of burning the six-hour default.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-22.04]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # No submodules: this repository has none.
          submodules: false

      - name: Disable Defender real-time scan for workspace (Windows only)
        # Windows-hosted runners ship Defender with real-time
        # protection on. When Tantivy commits a segment, Defender
        # briefly opens the new file to scan it, holding a handle
        # that races with Tantivy's rename/delete and surfaces as
        # `Access is denied (os error 5)`. PR #16 hit this in
        # `phase_04_index::recovery_from_simulated_kill_dash_9`.
        # Excluding the workspace + runner temp is the standard fix
        # used by most Rust-on-Windows CI flows.
        #
        # The phase_04_index smoke tests open the Tantivy index under
        # `tempfile::tempdir()`, which resolves to the *process* temp dir
        # (`%TEMP%` = C:\Users\runneradmin\AppData\Local\Temp) — NOT
        # `$RUNNER_TEMP` (D:\a\_temp). Excluding only the workspace and
        # $RUNNER_TEMP left that path scanned, so Defender still raced the
        # segment commit and surfaced `Access is denied (os error 5)` in
        # `round_trip_create_modify_rename_delete_attrchange`. Exclude the
        # process temp dir too — that is where the index actually lives.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE
          Add-MpPreference -ExclusionPath $env:RUNNER_TEMP
          Add-MpPreference -ExclusionPath ([System.IO.Path]::GetTempPath())

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/freally-ui/src-tauri
          # Only `main` writes the cache. Every branch reads it, so
          # letting PRs save as well means they evict each other's
          # entries — and the shared base — out of the 10 GB budget.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install Linux build deps (ubuntu only)
        if: runner.os == 'Linux'
        # `apt-get update` stalled mid-fetch three times in one day on this
        # runner class — once in `ci.yml` and twice on the v0.23.1 release —
        # each time after pulling the Google/Microsoft/jammy-updates indexes
        # and never returning for the main jammy archive. A stalled fetch has
        # no timeout by default, so the step sat for 30-46 minutes against a
        # 72-second baseline and had to be cancelled by hand. Both of those
        # were release-blocking.
        #
        # `Timeout` turns a dead mirror into an error instead of a hang;
        # `Retries` plus the loop rides out a mirror that is merely flaky.
        # `timeout-minutes` is the backstop: if it hangs anyway, the job
        # fails in ten minutes rather than burning the six-hour default.
        timeout-minutes: 10
        run: |
          # The runner images resolve their Ubuntu mirror through
          # /etc/apt/apt-mirrors.txt, which puts azure.archive.ubuntu.com
          # first. That host went dark on 2026-08-19 and stayed dark: every
          # jammy index came back `Ign:`, round after round, while
          # archive.ubuntu.com served the same files fine in the same job.
          # Point apt at the canonical archive so a single mirror's outage
          # is not a release outage.
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list 2>/dev/null || true
          sudo tee /etc/apt/apt.conf.d/99-freally-timeouts >/dev/null <<'CONF'
          Acquire::Retries "2";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          CONF
          for attempt in 1 2 3; do
            if sudo apt-get update; then break; fi
            echo "::warning::apt-get update failed (attempt $attempt/3) — retrying"
            sleep 10
          done
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Setup Node + pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/freally-ui/pnpm-lock.yaml

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (workspace, -D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # `apps/freally-ui/src-tauri` is `exclude`d from the workspace, so
      # neither of the two steps above ever saw it — three clippy errors
      # sat there failing silently for most of a release cycle. It needs
      # its own invocation against its own manifest; the Linux system
      # deps installed above are what let it configure on ubuntu.
      - name: rustfmt + clippy (src-tauri, -D warnings)
        working-directory: apps/freally-ui/src-tauri
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets --locked -- -D warnings

      # And its tests, for the same reason the step above exists: the
      # crate is excluded from the workspace, so `--workspace` never
      # reaches it. Without this the menu-bar and status-bar parity
      # suites, and the Phase-13 packaging + updater gates, compile under
      # clippy and are never executed — a test that cannot fail is
      # indistinguishable from one that passes.
      #
      # `cargo test`, not nextest: `.config/nextest.toml` lives at the
      # workspace root and does not apply here, and none of these build a
      # Tantivy index, which is the whole reason the workspace suite wants
      # a process per test.
      - name: cargo test (src-tauri)
        working-directory: apps/freally-ui/src-tauri
        run: cargo test --locked

      # nextest, not `cargo test`: one process per test instead of one
      # thread, which this suite benefits from unusually much — most of
      # the 760 tests build their own Tantivy index, and the
      # process-per-test model keeps those off each other's locks.
      # Measured warm on the dev machine: 100s to 37s.
      # The timed-budget tests come out of the parallel run and go last,
      # on their own. nextest's process-per-test model is the whole reason
      # the suite is fast, and it is also a machine under sustained load —
      # which is the one condition under which a wall-clock assertion
      # measures the load instead of the code. `scripts/ci-local.mjs` does
      # exactly this; the two have to agree or the local gate stops
      # predicting this one.
      - name: cargo nextest
        shell: bash
        run: cargo nextest run --workspace --locked -E 'not (test(magic_moment) or test(latency))'

      - name: cargo nextest (timed budgets, run alone)
        shell: bash
        run: cargo nextest run --workspace --locked -E 'test(magic_moment) or test(latency)'

      # nextest does not run doctests. There are none that execute
      # today, and this is the guard that says so out loud rather than
      # letting a future one be silently skipped. One OS is enough —
      # doctests are not platform-specific.
      - name: cargo test --doc
        if: runner.os == 'Linux'
        run: cargo test --workspace --doc --locked

      # Validates the .ftl catalogues against each other. Nothing in it
      # reads the platform, so running it three times only ever produced
      # the same answer three times.
      - name: xtask i18n-lint
        if: runner.os == 'Linux'
        run: cargo run -p xtask --locked -- i18n-lint

      - name: Phase 13 — fsbench correctness + benchmark (1.5M files)
        # Generates a 1.5M-file synthetic tree, walks it once via the
        # OS-specific fast primitive (getattrlistbulk on macOS,
        # getdents64+statx on Linux) and once via the walkdir baseline.
        # The CI gate is correctness — both walkers must report
        # identical file/dir/byte totals. The full scan-output lines
        # (with elapsed-time + files/s throughput) are echoed loudly so
        # the benchmark numbers show up clearly in the job log.
        #
        # Skips on Windows: Freally's production Windows bootstrap is
        # the MFT-direct-read in `freally-journal-win`, not a userland
        # FindFirstFileExW walk. On Windows the fsbench binary falls
        # back to walkdir so the comparison would be tautological;
        # MFT verification lives in the freally-journal-win test
        # suite instead.
        if: runner.os == 'macOS' || runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::build freally-fsbench --release"
          cargo build -p freally-fsbench --release
          echo "::endgroup::"
          bin=./target/release/freally-fsbench
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          count=1500000
          echo "::group::gen — ${count} synthetic files"
          "$bin" gen --root "$tmpdir/tree" --count "$count"
          echo "::endgroup::"

          # Fast path
          echo "::group::scan — fast path"
          fast_line=$("$bin" scan --root "$tmpdir/tree")
          echo "$fast_line"
          echo "::endgroup::"

          # Baseline path
          echo "::group::scan — walkdir baseline"
          base_line=$("$bin" scan --root "$tmpdir/tree" --baseline)
          echo "$base_line"
          echo "::endgroup::"

          # Correctness gate — count-trimmed summaries must match.
          fast=$(printf '%s' "$fast_line" \
            | grep -oE '[0-9]+ file\(s\), [0-9]+ dir\(s\), [0-9]+ bytes')
          base=$(printf '%s' "$base_line" \
            | grep -oE '[0-9]+ file\(s\), [0-9]+ dir\(s\), [0-9]+ bytes')
          if [ "$fast" != "$base" ]; then
            echo "::error::fsbench fast path and walkdir baseline disagree"
            echo "  fast    : $fast"
            echo "  baseline: $base"
            exit 1
          fi

          # Benchmark summary — emitted as a CI notice so it surfaces
          # in the PR's check-run sidebar, not just buried in the log.
          echo "::notice title=fsbench ${{ matrix.os }}::FAST: $fast_line"
          echo "::notice title=fsbench ${{ matrix.os }}::BASE: $base_line"
          echo "::notice title=fsbench ${{ matrix.os }}::counts agree ✓ ($fast)"

      - name: Install cargo-deny
        # `EmbarkStudios/cargo-deny-action@v2` is a Docker container
        # action — `Container action is only supported on Linux` on
        # macOS / Windows runners. License + advisory checks are OS-
        # agnostic, so one Linux run covers the workspace.
        #
        # The action's container ships rustup 1.85.0, but this repo's
        # `rust-toolchain.toml` pins 1.97.1. rustup reads that file as an
        # override and aborts with `override toolchain '1.97.1-...' is not
        # installed` *before* cargo-deny runs. cargo-deny only parses
        # Cargo.lock + deny.toml (it never compiles the workspace), so the
        # container's own toolchain is sufficient. Setting RUSTUP_TOOLCHAIN
        # tells rustup to ignore rust-toolchain.toml and use the named
        # toolchain — 1.85.0 is already baked into the image, so this adds
        # zero download and keeps the step deterministic.
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@v2
        env:
          RUSTUP_TOOLCHAIN: "1.85.0"
        with:
          command: check
          arguments: --all-features

      - name: Install pnpm deps
        working-directory: apps/freally-ui
        # Frozen: the lockfile is committed, so CI resolving a different
        # tree than the one that was reviewed is a failure, not a
        # convenience. It is also the faster path — no resolution pass.
        run: pnpm install --frozen-lockfile

      - name: pnpm svelte-check (type errors + a11y warnings)
        working-directory: apps/freally-ui
        run: pnpm run check

      - name: pnpm vitest (unit tests, includes i18n lockstep + reactivity)
        working-directory: apps/freally-ui
        run: pnpm run test:unit

      - name: tauri build (debug, current OS only)
        working-directory: apps/freally-ui
        # ci only verifies the app + frontend COMPILE; --no-bundle skips the
        # heavy bundling (deb/rpm/appimage) + the signed updater artifact,
        # which exhausted the ubuntu runner's disk (os error 28). Full
        # bundling + signing are verified at release time by release.yml.
        run: pnpm tauri build --debug --no-bundle

      - name: Phase 2 smoke — FSEvents subscriber (macOS only)
        if: runner.os == 'macOS'
        run: bash tests/smoke/phase_02_journal_mac.sh
